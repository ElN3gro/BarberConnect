# render.yaml — Infraestructura como código para Render
# Documentación: https://render.com/docs/blueprint-spec

services:
  # ==================== BACKEND ====================
  - type: web
    name: barberconnect-api
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: barberconnect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://barberconnect.onrender.com
      # Estas las debes agregar manualmente en el panel de Render:
      # - WHATSAPP_TOKEN
      # - WHATSAPP_PHONE_ID
      # - WHATSAPP_VERIFY_TOKEN
      # - CLOUDINARY_CLOUD_NAME
      # - CLOUDINARY_API_KEY
      # - CLOUDINARY_API_SECRET

  # ==================== FRONTEND ====================
  - type: web
    name: barberconnect
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://barberconnect-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ==================== BASE DE DATOS ====================
databases:
  - name: barberconnect-db
    plan: free
    region: oregon
